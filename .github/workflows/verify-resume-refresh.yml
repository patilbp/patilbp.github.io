name: Verify résumé refresh preview
on:
  push:
    branches:
      - preview/about-personal-voice
    paths:
      - 'src/**'
      - 'package.json'
      - 'astro.config.mjs'
      - '.github/workflows/verify-resume-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Astro website
        run: npm run build
